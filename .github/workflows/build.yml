name: TWRP - Build

# Credits to:
# https://github.com/TeamWin
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'TWRP Device Tree'
        required: true
        default: 'https://github.com/TeamWin/android_device_xiaomi_dipper'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/dipper'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'dipper'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
        - bootimage
        - recoveryimage
        - vendorbootimage

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt update
        sudo apt install aria2 git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 bc cpio python3-pip python-is-python3 -y
        sudo apt install repo -y || sudo apt install repo -y
        sudo pip3 install pycryptodome pycryptodomex
        
    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/TWRP
        cd ${GITHUB_WORKSPACE}/TWRP
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        
        # Initialize TWRP manifest (latest branch)
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        
        # Sync the repo
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building TWRP
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        make clean
        mka ${{ inputs.BUILD_TARGET }}

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/TWRP

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/TWRP*.img
          TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/twrp*.img
          TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
          TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
          TWRP/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: TWRP Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP Recovery Build - Unofficial
          Build: twrp-12.1 (latest)
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
